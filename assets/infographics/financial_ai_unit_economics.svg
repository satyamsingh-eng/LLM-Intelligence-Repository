<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" style="background:#000000; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;">
  <rect x="0" y="0" width="1200" height="600" fill="#000000"/>
  <rect x="20" y="20" width="1160" height="560" rx="16" fill="#1c1c1e" stroke="#333336" stroke-width="1"/>
  
  <text x="50" y="65" fill="#ffffff" font-size="22" font-weight="700" letter-spacing="-0.5">Financial Services Unit Economics (100,000 Report Simulation)</text>
  <text x="50" y="90" fill="#86868b" font-size="13">Comparing Total Operating Cost in Indian Rupees (₹) across Routing Paradigms</text>
  <line x1="50" y1="110" x2="1150" y2="110" stroke="#333336" stroke-width="1"/>

  <!-- Bar 1: All-Closed Frontier -->
  <text x="50" y="160" fill="#ffffff" font-size="14" font-weight="700">1. All-Closed Frontier Route (Claude Opus 5 / GPT-5.6 Sol)</text>
  <rect x="50" y="175" width="900" height="40" rx="8" fill="#2c2c2e"/>
  <rect x="50" y="175" width="900" height="40" rx="8" fill="#ff453a" opacity="0.85"/>
  <text x="960" y="200" fill="#ff453a" font-size="16" font-weight="800">₹27,14,000</text>
  <text x="65" y="200" fill="#ffffff" font-size="12" font-weight="600">₹27.14 per report | Baseline Cost (0% Savings)</text>

  <!-- Bar 2: Financial SOTA Sync Route -->
  <text x="50" y="260" fill="#ffffff" font-size="14" font-weight="700">2. Financial SOTA Sync Route (Kimi K3 Moonshot AI)</text>
  <rect x="50" y="275" width="900" height="40" rx="8" fill="#2c2c2e"/>
  <rect x="50" y="275" width="720" height="40" rx="8" fill="#ffd60a" opacity="0.85"/>
  <text x="960" y="300" fill="#ffd60a" font-size="16" font-weight="800">₹21,78,000</text>
  <text x="65" y="300" fill="#000000" font-size="12" font-weight="700">₹21.78 per report | 19.7% Savings vs Baseline</text>

  <!-- Bar 3: Hybrid Cascading Route (SARVAX SOTA) -->
  <text x="50" y="360" fill="#ffffff" font-size="14" font-weight="700">3. SARVAX Hybrid Cascading Route (DeepSeek V4 + Kimi K3 Audit Gate)</text>
  <rect x="50" y="375" width="900" height="40" rx="8" fill="#2c2c2e"/>
  <rect x="50" y="375" width="83" height="40" rx="8" fill="#30d158"/>
  <text x="960" y="400" fill="#30d158" font-size="18" font-weight="800">₹2,49,999</text>
  <text x="145" y="400" fill="#30d158" font-size="13" font-weight="700">₹2.50 per report | 90.8% Savings (₹24.6 Lakhs Saved)</text>

  <!-- Highlight Box -->
  <rect x="50" y="450" width="1070" height="90" rx="12" fill="#000000" stroke="#30d158" stroke-width="1.5"/>
  <text x="70" y="485" fill="#30d158" font-size="14" font-weight="700">STRATEGIC FINANCIAL IMPACT FOR C3A LABS ENTERPRISE CLIENTS</text>
  <text x="70" y="512" fill="#ffffff" font-size="13">Deploying the SARVAX Hybrid Routing Engine recovers <tspan fill="#30d158" font-weight="700">₹24.6 Lakhs per 100,000 reports</tspan> while maintaining #1 TAU Banking financial reasoning accuracy and zero HTTP 429 concurrency throttling.</text>
</svg>
