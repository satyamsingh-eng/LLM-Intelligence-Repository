<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" style="background:#000000; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;">
  <!-- Background Card -->
  <rect x="0" y="0" width="1200" height="600" fill="#000000"/>
  <rect x="20" y="20" width="1160" height="560" rx="16" fill="#1c1c1e" stroke="#333336" stroke-width="1"/>
  
  <!-- Header -->
  <text x="50" y="65" fill="#ffffff" font-size="22" font-weight="700" letter-spacing="-0.5">SARVAX Multi-Model Dynamic Routing Engine</text>
  <text x="50" y="90" fill="#86868b" font-size="13">Enterprise Architecture Blueprint &amp; Tiered Task Assignment Policy</text>
  <line x1="50" y1="110" x2="1150" y2="110" stroke="#333336" stroke-width="1"/>

  <!-- Ingestion Layer Box -->
  <rect x="50" y="140" width="230" height="400" rx="12" fill="#000000" stroke="#0071e3" stroke-width="1.5"/>
  <text x="70" y="175" fill="#2997ff" font-size="12" font-weight="700" letter-spacing="1">1. INGESTION &amp; OCR</text>
  <text x="70" y="205" fill="#ffffff" font-size="16" font-weight="700">Gemini 2.0 Flash</text>
  <text x="70" y="225" fill="#86868b" font-size="12">Vertex AI (Unlimited)</text>
  <rect x="70" y="245" width="190" height="1" fill="#333336"/>
  <text x="70" y="275" fill="#ffffff" font-size="12" font-weight="600">• Native 2M Context</text>
  <text x="70" y="295" fill="#ffffff" font-size="12" font-weight="600">• Zero HTTP 429 Caps</text>
  <text x="70" y="315" fill="#ffffff" font-size="12" font-weight="600">• Rate: ₹6.26 / 1M In</text>
  <text x="70" y="335" fill="#30d158" font-size="12" font-weight="700">Primary Sync UI Route</text>

  <!-- Flow Arrows -->
  <path d="M 280 340 L 330 340" stroke="#0071e3" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Routing Router Box -->
  <rect x="330" y="220" width="160" height="240" rx="12" fill="#1c1c1e" stroke="#333336" stroke-width="1"/>
  <text x="350" y="255" fill="#86868b" font-size="11" font-weight="700">SARVAX ROUTER</text>
  <text x="350" y="280" fill="#ffffff" font-size="13" font-weight="700">Task Classifier</text>
  <text x="350" y="305" fill="#86868b" font-size="11">Workload Risk</text>
  <text x="350" y="325" fill="#86868b" font-size="11">SLA Requirements</text>
  <text x="350" y="345" fill="#86868b" font-size="11">Token Budget</text>

  <!-- Output Tracks -->
  <!-- Track A: Financial Reasoning -->
  <rect x="540" y="140" width="580" height="110" rx="12" fill="#000000" stroke="#ffd60a" stroke-width="1"/>
  <text x="560" y="170" fill="#ffd60a" font-size="12" font-weight="700" letter-spacing="0.5">TRACK A: FINANCIAL REASONING &amp; ADVISORY (#1 SOTA)</text>
  <text x="560" y="195" fill="#ffffff" font-size="16" font-weight="700">Kimi K3 (Moonshot AI)</text>
  <text x="560" y="218" fill="#86868b" font-size="12">TAU Banking Score: 0.3340 (#1 Globally) | Rate: ₹250.50 / 1M In | ₹1,252.50 / 1M Out</text>

  <!-- Track B: Bulk Async DAG -->
  <rect x="540" y="270" width="580" height="110" rx="12" fill="#000000" stroke="#30d158" stroke-width="1"/>
  <text x="560" y="300" fill="#30d158" font-size="12" font-weight="700" letter-spacing="0.5">TRACK B: BULK ASYNCHRONOUS WORKFLOWS (82% SAVINGS)</text>
  <text x="560" y="325" fill="#ffffff" font-size="16" font-weight="700">DeepSeek V4 Pro / Qwen 3.7 Max</text>
  <text x="560" y="348" fill="#86868b" font-size="12">Rate: ₹36.32 / 1M In | Isolated to background async cron queues to avoid 60 RPM caps</text>

  <!-- Track C: High Risk Audit -->
  <rect x="540" y="400" width="580" height="110" rx="12" fill="#000000" stroke="#bf5af2" stroke-width="1"/>
  <text x="560" y="430" fill="#bf5af2" font-size="12" font-weight="700" letter-spacing="0.5">TRACK C: HIGH-RISK AUDIT &amp; COMPLIANCE GATES (15% FINAL STEP)</text>
  <text x="560" y="455" fill="#ffffff" font-size="16" font-weight="700">Claude Opus 5 / GLM-4.7</text>
  <text x="560" y="478" fill="#86868b" font-size="12">World #1 Intel Index (60.7) &amp; SWE-bench SOTA (88.0%) for final binding report approval</text>

  <!-- Arrow Marker Definition -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0071e3"/>
    </marker>
  </defs>
</svg>
