<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" style="background:#000000; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;">
  <rect x="0" y="0" width="1200" height="600" fill="#000000"/>
  <rect x="20" y="20" width="1160" height="560" rx="16" fill="#1c1c1e" stroke="#333336" stroke-width="1"/>
  
  <text x="50" y="65" fill="#ffffff" font-size="22" font-weight="700" letter-spacing="-0.5">SARVAX 4-Layer Open-Source Deep Research Engine Stack</text>
  <text x="50" y="90" fill="#86868b" font-size="13">Universal Document Parsing, Knowledge Graph Memory, Research Synthesis &amp; Agent Swarms</text>
  <line x1="50" y1="110" x2="1150" y2="110" stroke="#333336" stroke-width="1"/>

  <g transform="translate(50, 140)">
    <!-- Layer 1 -->
    <rect x="0" y="0" width="250" height="380" rx="12" fill="#000000" stroke="#0071e3" stroke-width="1"/>
    <text x="20" y="35" fill="#2997ff" font-size="12" font-weight="700" letter-spacing="1">LAYER 1: INGESTION</text>
    <text x="20" y="65" fill="#ffffff" font-size="16" font-weight="700">MarkItDown + Gemini OCR</text>
    <text x="20" y="95" fill="#86868b" font-size="12" width="210">Microsoft MarkItDown handles universal document conversion (PDF, DOCX, XLSX). Unstructured scans passed to Gemini 3 Flash OCR.</text>
    
    <!-- Layer 2 -->
    <rect x="280" y="0" width="250" height="380" rx="12" fill="#000000" stroke="#30d158" stroke-width="1"/>
    <text x="300" y="35" fill="#30d158" font-size="12" font-weight="700" letter-spacing="1">LAYER 2: KNOWLEDGE GRAPH</text>
    <text x="300" y="65" fill="#ffffff" font-size="16" font-weight="700">GraphRAG + LightRAG</text>
    <text x="300" y="95" fill="#86868b" font-size="12">Microsoft GraphRAG and HKU LightRAG construct multi-hop entity relationship graphs, eliminating flat vector RAG hallucinations.</text>

    <!-- Layer 3 -->
    <rect x="560" y="0" width="250" height="380" rx="12" fill="#000000" stroke="#ffd60a" stroke-width="1"/>
    <text x="580" y="35" fill="#ffd60a" font-size="12" font-weight="700" letter-spacing="1">LAYER 3: SYNTHESIS</text>
    <text x="580" y="65" fill="#ffffff" font-size="16" font-weight="700">STORM + Crawl4AI</text>
    <text x="580" y="95" fill="#86868b" font-size="12">Stanford STORM runner executes perspective-driven research with live web sweeps via Crawl4AI/Firecrawl to write cited reports.</text>

    <!-- Layer 4 -->
    <rect x="840" y="0" width="250" height="380" rx="12" fill="#000000" stroke="#bf5af2" stroke-width="1"/>
    <text x="860" y="35" fill="#bf5af2" font-size="12" font-weight="700" letter-spacing="1">LAYER 4: AGENT SWARM</text>
    <text x="860" y="65" fill="#ffffff" font-size="16" font-weight="700">CrewAI + NVIDIA AI-Q</text>
    <text x="860" y="95" fill="#86868b" font-size="12">Role-playing multi-agent crews executing enterprise workflows gated by Workflow 2.0 DAG approval steps.</text>
  </g>
</svg>
